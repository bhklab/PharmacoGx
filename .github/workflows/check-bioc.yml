## Generated with biocthis::use_bioc_github_action() as a baseline, then
## adapted for current r-lib/actions, release/devel coverage, and this
## repository's Docker publishing workflow.

name: R-CMD-check-bioc

on:
  push:
    branches: [devel]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NOT_CRAN: true
  R_KEEP_PKG_SOURCE: yes
  TZ: UTC

jobs:
  bioc-config:
    name: Resolve Bioconductor versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      check-matrix: ${{ steps.matrix.outputs.check-matrix }}
      docker-matrix: ${{ steps.matrix.outputs.docker-matrix }}
    steps:
      - name: Build release-aware matrices
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://bioconductor.org/config.yaml \
            --output "${RUNNER_TEMP}/bioconductor-config.yaml"

          ruby -ryaml -rjson <<'RUBY'
          config = YAML.load_file(File.join(ENV.fetch("RUNNER_TEMP"), "bioconductor-config.yaml"))
          release = config.fetch("release_version")
          devel = config.fetch("devel_version")
          release_r = config.fetch("r_version_associated_with_release").sub(/\.0$/, "")
          devel_r = config.fetch("r_version_associated_with_devel").sub(/\.0$/, "")

          major, minor = release.split(".").map(&:to_i)
          oldrel = "#{major}.#{minor - 1}"
          oldrel_r = config.fetch("r_ver_for_bioc_ver").fetch(oldrel)
          release_tag = "RELEASE_#{major}_#{minor}"
          oldrel_tag = "RELEASE_#{major}_#{minor - 1}"

          checks = {
            "config" => [
              {
                "id" => "linux-devel",
                "os" => "ubuntu-latest",
                "r" => devel_r,
                "bioc" => devel,
                "container" => "bioconductor/bioconductor_docker:devel",
                "run_bioccheck" => true
              },
              {
                "id" => "linux-release",
                "os" => "ubuntu-latest",
                "r" => release_r,
                "bioc" => release,
                "container" => "bioconductor/bioconductor_docker:#{release_tag}",
                "run_bioccheck" => false
              },
              {
                "id" => "linux-oldrel",
                "os" => "ubuntu-latest",
                "r" => oldrel_r,
                "bioc" => oldrel,
                "container" => "bioconductor/bioconductor_docker:#{oldrel_tag}",
                "run_bioccheck" => false
              },
              {
                "id" => "macos-release",
                "os" => "macos-latest",
                "r" => release_r,
                "bioc" => release,
                "run_bioccheck" => false
              },
              {
                "id" => "windows-release",
                "os" => "windows-latest",
                "r" => release_r,
                "bioc" => release,
                "run_bioccheck" => false
              }
            ]
          }

          docker = {
            "config" => [
              {
                "channel" => "devel",
                "tag" => "devel",
                "r" => devel_r
              },
              {
                "channel" => "release",
                "tag" => release_tag,
                "r" => release_r
              },
              {
                "channel" => "oldrel",
                "tag" => oldrel_tag,
                "r" => oldrel_r
              }
            ]
          }

          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts("check-matrix=#{JSON.generate(checks)}")
            output.puts("docker-matrix=#{JSON.generate(docker)}")
          end

          warn "Check matrix: #{JSON.pretty_generate(checks)}"
          warn "Docker matrix: #{JSON.pretty_generate(docker)}"
          RUBY

  build-check:
    name: ${{ matrix.config.id }} (R ${{ matrix.config.r }}, Bioc ${{ matrix.config.bioc }})
    needs: bioc-config
    runs-on: ${{ matrix.config.os }}
    container: ${{ matrix.config.container }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bioc-config.outputs.check-matrix) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_BIOC_VERSION: ${{ matrix.config.bioc }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Set up Pandoc
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-pandoc@v2

      - name: Select Bioconductor version
        shell: Rscript {0}
        run: |
          if (!requireNamespace("BiocManager", quietly = TRUE)) {
            install.packages("BiocManager")
          }
          BiocManager::install(
            version = "${{ matrix.config.bioc }}",
            ask = FALSE,
            update = FALSE
          )
          stopifnot(
            identical(
              as.character(BiocManager::version()),
              "${{ matrix.config.bioc }}"
            )
          )

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install and verify BiocCheck
        if: matrix.config.run_bioccheck
        shell: Rscript {0}
        run: |
          BiocManager::install("BiocCheck", ask = FALSE, update = FALSE)
          stopifnot(requireNamespace("BiocCheck", quietly = TRUE))

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-vignettes", "--timings")'
          build_args: 'c("--no-manual", "--keep-empty-dirs", "--no-resave-data")'
          error-on: '"warning"'
          check-dir: '"check"'
          artifact-name: ${{ matrix.config.id }}-check-results

      - name: Run BiocCheck
        if: matrix.config.run_bioccheck
        shell: Rscript {0}
        run: |
          tarballs <- list.files(
            "check",
            pattern = "[.]tar[.]gz$",
            full.names = TRUE
          )
          stopifnot(length(tarballs) == 1L)
          BiocCheck::BiocCheck(
            tarballs,
            `quit-with-status` = TRUE,
            `no-check-R-ver` = TRUE,
            `no-check-bioc-help` = TRUE
          )

  docker-build-and-push:
    name: Docker (${{ matrix.config.channel }})
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/devel' &&
      !contains(github.event.head_commit.message, '/nodocker')
    needs: [bioc-config, build-check]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bioc-config.outputs.docker-matrix) }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve image and package metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY#*/}"
          echo "image=bhklab/${repository,,}" >> "$GITHUB_OUTPUT"
          awk '/^Version:/ { print "version=" $2 }' DESCRIPTION >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.BHKLAB_DOCKERHUB_USERNAME }}
          password: ${{ secrets.BHKLAB_DOCKERHUB_ACCESS_KEY }}

      - name: Generate Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.package.outputs.image }}
          tags: |
            type=raw,value=devel,enable=${{ matrix.config.channel == 'devel' }}
            type=raw,value=release,enable=${{ matrix.config.channel == 'release' }}
            type=raw,value=latest,enable=${{ matrix.config.channel == 'release' }}
            type=raw,value=BIOC-${{ matrix.config.tag }}_R-${{ matrix.config.r }}__${{ steps.package.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=bioconductor/bioconductor_docker:${{ matrix.config.tag }}
          cache-from: type=gha,scope=pharmacogx-${{ matrix.config.channel }}
          cache-to: type=gha,mode=max,scope=pharmacogx-${{ matrix.config.channel }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
